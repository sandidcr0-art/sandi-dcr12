
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sistem Bilangan</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow p-4 mx-auto" style="max-width: 600px;">
            <h2 class="text-center mb-4">Kalkulator Sistem Bilangan</h2>

            <div class="mb-3">
                <label for="angka" class="form-label">Masukkan Angka</label>
                <input type="text" id="angka" class="form-control"
                       placeholder="Masukkan angka">
            </div>

            <div class="mb-3">
                <label for="asal" class="form-label">Sistem Bilangan Input</label>
                <select id="asal" class="form-select">
                    <option value="2">Biner (Basis 2)</option>
                    <option value="10" selected>Desimal (Basis 10)</option>
                    <option value="8">Oktal (Basis 8)</option>
                    <option value="16">Heksadesimal (Basis 16)</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="tujuan" class="form-label">Sistem Bilangan Hasil</label>
                <select id="tujuan" class="form-select">
                    <option value="2">Biner (Basis 2)</option>
                    <option value="10">Desimal (Basis 10)</option>
                    <option value="8">Oktal (Basis 8)</option>
                    <option value="16" selected>Heksadesimal (Basis 16)</option>
                </select>
            </div>

            <button class="btn btn-primary w-100"
                    onclick="konversikan()">
                Konversi
            </button>

            <div class="text-center mt-4">
                <p class="mb-1">Hasil Konversi:</p>
                <h2 id="hasil" class="fw-bold text-primary"
                    style="font-size: 2.5rem;">
                    -
                </h2>
                <p id="pesan" class="text-danger"></p>
            </div>

            <hr>
            <p class="text-center text-muted mb-0">
                Dibuat oleh: Nama Kamu
            </p>
        </div>
    </div>

    <script>
        function konversikan() {
            const angka = document.getElementById("angka").value.trim();
            const asal = parseInt(document.getElementById("asal").value);
            const tujuan = parseInt(document.getElementById("tujuan").value);
            const hasil = document.getElementById("hasil");
            const pesan = document.getElementById("pesan");

            pesan.textContent = "";

            if (angka === "") {
                hasil.textContent = "-";
                pesan.textContent = "Masukkan angka terlebih dahulu!";
                return;
            }

            // Validasi angka berdasarkan sistem bilangan input
            const pola = {
                2: /^[01]+$/,
                8: /^[0-7]+$/,
                10: /^[0-9]+$/,
                16: /^[0-9a-fA-F]+$/
            };

            if (!pola[asal].test(angka)) {
                hasil.textContent = "-";
                pesan.textContent =
                    "Angka tidak valid untuk sistem bilangan yang dipilih!";
                return;
            }

            const nilai = parseInt(angka, asal);

            if (!Number.isSafeInteger(nilai)) {
                hasil.textContent = "-";
                pesan.textContent = "Angka terlalu besar untuk dikonversi.";
                return;
            }

            hasil.textContent = nilai.toString(tujuan).toUpperCase();
        }
    </script>

</body>
</html>
